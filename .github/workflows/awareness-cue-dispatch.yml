# Triggers the awareness-cue-dispatch Edge Function on a schedule.
#
# Deliberately an external (GitHub Actions) trigger rather than
# Supabase Cron/pg_cron: this project is on Supabase's Free tier, which
# auto-pauses a project after 7 days with no *user* activity, and
# Supabase does not document a self-triggered pg_cron job as counting
# toward that. An inbound HTTP request from here unambiguously does --
# see the feasibility audit, 2026-08-22. Every run showing green in the
# Actions tab also doubles as a free liveness signal for the dispatch
# pipeline, with no extra tooling.
#
# Required repo secret: AWARENESS_CUE_CRON_SECRET -- must match the
# same-named Edge Function secret set in the Supabase dashboard.
# The Supabase anon key is intentionally hardcoded below, not a
# secret -- it's already public, shipped inside the app itself
# (lib/supabase.js).

name: Awareness Cue Dispatch

on:
  schedule:
    # Every 10 minutes -- middle of the 5-15 min range weighed in the
    # feasibility audit. GitHub Actions doesn't guarantee exact timing
    # under load; the dispatch function's own stale-row cutoff (2h) is
    # what actually absorbs any real-world drift or missed runs, not
    # this cadence.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call awareness-cue-dispatch
        env:
          # Passed via env, not spliced directly into the script below
          # via ${{ }} -- GitHub substitutes ${{ }} expressions into the
          # run script's raw text before bash parses it, so a secret
          # value containing a backtick/quote/$() would corrupt the
          # script itself. Referencing it as a normal shell variable
          # instead means bash only ever sees $CRON_SECRET, never the
          # literal secret text spliced into the source.
          CRON_SECRET: ${{ secrets.AWARENESS_CUE_CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST \
            "https://nzuvxqrnrknyfijowics.supabase.co/functions/v1/awareness-cue-dispatch" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56dXZ4cXJucmtueWZpam93aWNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNTY2OTQsImV4cCI6MjA5OTgzMjY5NH0.dgRLhokAEMAgiOMPZzS0t08hwAsNtIefyC8_KFrxzYg"
